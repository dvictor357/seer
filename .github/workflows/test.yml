name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # README promises 3.8+; uv ships 3.8 builds that setup-python no longer has on current runners
        python: ["3.8", "3.10", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Run tests (offline, stdlib only)
        run: |
          PY="$(uv python find ${{ matrix.python }})"
          "$PY" --version
          "$PY" -I -B -m unittest discover -s tests -v
